   <div style="font-size: 30px; background-color: cadetblue; padding: 15px; margin: auto; width: 580px;">

   <h2>SKU Genarator</h2> 
    <label>Product Category:</label><br> 
    <input type="text" id="category" placeholder="Enter a number"><br>
    <label>Product:</label><br>
    <input type="text" id="product"><br>
    <label>Stock Quantity:</label><br>
    <input type="text" id="stock" placeholder="Enter a number"><br>
    <button type="submit" py-click="adding_numbers">Get Total</button><br><br>
    <div id="output1"></div>
     
    <h2>Receipt Genarator</h2>

        <option value="30">Fries - 30</option>
        <option value="45">Hot Dog - 45</option>
        <option value="50">Hamburger - 50</option>

    <button type="submit" pyclick="create_order">Create Order</button><br><br>

    <div id="show"></div>
